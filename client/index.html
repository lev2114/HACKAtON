<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Шаролёт</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; font-family: system-ui, sans-serif; }
      canvas { display: block; }

      #login {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #05060a; z-index: 10;
      }
      #login form { display: flex; gap: 8px; }
      #login input { padding: 8px 12px; font-size: 16px; border-radius: 6px; border: 1px solid #444; }
      #login button { padding: 8px 16px; font-size: 16px; cursor: pointer; border-radius: 6px; border: none; background: #4a7cff; color: white; }

      #hud {
        position: fixed; top: 12px; left: 12px; color: #cfd8ff; font-size: 14px;
        z-index: 5; pointer-events: none; text-shadow: 0 1px 2px #000;
      }
      #controls {
        position: fixed; bottom: 10px; right: 12px; color: #8a93b8; font-size: 12px;
        z-index: 5; pointer-events: none; text-align: right; text-shadow: 0 1px 2px #000;
      }

      /* ── Панель диалога с NPC ── */
      #npc-dialog {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: min(560px, 92vw);
        max-height: 55vh;
        background: rgba(8, 10, 22, 0.94);
        border: 1px solid rgba(90, 130, 255, 0.25);
        border-radius: 14px;
        display: none;          /* показывается через JS */
        flex-direction: column;
        z-index: 20;
        box-shadow: 0 4px 32px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }

      /* Заголовок: имя NPC + кнопка закрытия */
      #npc-dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px 8px;
        border-bottom: 1px solid rgba(90, 130, 255, 0.15);
        flex-shrink: 0;
      }
      #npc-dialog-header .npc-title {
        color: #8fd3ff;
        font-weight: 700;
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #npc-dialog-header .close-btn {
        background: none;
        border: none;
        color: #667;
        font-size: 20px;
        cursor: pointer;
        padding: 0 4px;
        line-height: 1;
        transition: color .15s;
      }
      #npc-dialog-header .close-btn:hover { color: #f66; }

      /* Область сообщений */
      #npc-dialog-messages {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 80px;
        max-height: 40vh;
      }

      /* Отдельное сообщение */
      .msg { font-size: 14px; line-height: 1.45; animation: msg-in .2s ease; }
      .msg.npc  { color: #e0e8ff; }
      .msg.user { color: #a8b8d8; text-align: right; }
      .msg .author { font-weight: 600; margin-right: 6px; }
      .msg.npc .author  { color: #8fd3ff; }
      .msg.user .author { color: #7c9cdc; }
      .msg.thinking { color: #6678; font-style: italic; }

      @keyframes msg-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Поле ввода */
      #npc-dialog-input-row {
        display: flex;
        gap: 6px;
        padding: 8px 12px 10px;
        border-top: 1px solid rgba(90, 130, 255, 0.15);
        flex-shrink: 0;
      }
      #npc-dialog-input {
        flex: 1;
        padding: 8px 10px;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid rgba(90, 130, 255, 0.3);
        background: rgba(20, 24, 44, 0.7);
        color: #e0e8ff;
        outline: none;
        transition: border-color .15s;
      }
      #npc-dialog-input:focus { border-color: rgba(90, 130, 255, 0.6); }
      #npc-dialog-input::placeholder { color: #5568; }
      #npc-dialog-send {
        padding: 8px 14px;
        font-size: 14px;
        border-radius: 8px;
        border: none;
        background: #4a7cff;
        color: #fff;
        cursor: pointer;
        transition: background .15s;
      }
      #npc-dialog-send:hover { background: #3a6aee; }
      #npc-dialog-send:disabled { opacity: .45; cursor: default; }

      /* Подсказка "нажми E" над NPC */
      #npc-hint {
        position: fixed;
        bottom: 140px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(143, 211, 255, 0.85);
        font-size: 14px;
        z-index: 5;
        pointer-events: none;
        text-shadow: 0 1px 4px #000;
        display: none;
      }

      /* Скроллбар для области сообщений */
      #npc-dialog-messages::-webkit-scrollbar { width: 5px; }
      #npc-dialog-messages::-webkit-scrollbar-track { background: transparent; }
      #npc-dialog-messages::-webkit-scrollbar-thumb { background: rgba(90, 130, 255, 0.25); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="login">
      <form id="login-form">
        <input id="login-name" placeholder="Имя космонавта" maxlength="20" required autofocus />
        <button type="submit">Войти на станцию</button>
      </form>
    </div>
    <div id="hud"></div>
    <div id="controls">
      WASD — двигаться · мышь (ЛКМ, затем двигать) — осмотреться<br />
      E — поговорить с ближайшим Смешариком · подойди к проёму — попадёшь в соседний отсек
    </div>

    <div id="npc-hint">[E] Поговорить</div>

    <div id="npc-dialog">
      <div id="npc-dialog-header">
        <span class="npc-title"></span>
        <button class="close-btn" title="Закрыть (Esc)">✕</button>
      </div>
      <div id="npc-dialog-messages"></div>
      <div id="npc-dialog-input-row">
        <input id="npc-dialog-input" placeholder="Спроси что-нибудь…" autocomplete="off" />
        <button id="npc-dialog-send">→</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
